[package]
name = "scan-worker"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Scanner drivers run in a process of their own: a worker serving any scan-device backends over JSON lines on its standard input and output, and the client that starts one for each device, watches it and reads its pages"
repository = "https://github.com/sheaf-pdf/pdf-scan"
# Provisional with the device model whose types its protocol carries: both
# are made ready to publish together (keywords, categories, the package's
# contents and a changelog come then).
publish = false

[dependencies]
# For a SANE worker's one-backend configuration directory alone: the client
# never loads libsane.
sane-dl = { path = "../sane-dl" }
# Its types are in this crate's API, and cross the pipe through its serde
# form.
scan-device = { path = "../scan-device", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
# Each worker's private directory, made atomically under a random name.
tempfile.workspace = true
thiserror.workspace = true

[features]
# SANE's backend, `scan_device::sane`, through the re-export
# `scan_worker::scan_device`, so an app's SANE worker serves the backend of
# the scan-device this crate's `serve` takes: it turns on scan-device's
# `sane`, and nothing else in the library changes with it.
sane = ["scan-device/sane"]
# The test worker, `scan-worker-fake`, a binary serving the scripted backend,
# SANE's, and protocol written by hand: for this crate's tests, never for a
# shipped build, since its scenarios hang, crash and break the protocol. It
# turns on scan-device's `fake`, and `sane`, which the re-export
# `scan_worker::scan_device` then holds; nothing else in the library changes
# with it. A binary takes its package's dependencies, never its
# dev-dependencies, so the backend it serves comes on through this feature.
fake = ["scan-device/fake", "sane"]

[dev-dependencies]
# The tests take the test worker: a dev-dependency on the crate itself turns
# `fake` on for them alone, so cargo builds the binary before the
# integration tests and gives its path.
scan-worker = { path = ".", features = ["fake"] }
# The unit tests drive a worker over pipes with the scripted backend.
scan-device = { path = "../scan-device", features = ["fake", "serde"] }

[[bin]]
name = "scan-worker-fake"
path = "src/bin/scan-worker-fake/main.rs"
required-features = ["fake"]
test = false
doc = false

[lints]
workspace = true
