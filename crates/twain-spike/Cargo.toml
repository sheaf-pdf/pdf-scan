[package]
name = "twain-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "A throwaway program that drives TWAIN end to end through the TWAIN Working Group's sample data source, and checks what it sees"
repository = "https://github.com/sheaf-pdf/pdf-scan"
# Never published, and no crate depends on it: it runs by hand and in CI's
# Windows TWAIN job, until twain-dsm's own tests replace it.
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
