[package]
name = "sane-dl"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "SANE scanner access with libsane loaded at run time: its own bindings, a safe handle, typed options, frames assembled"
repository = "https://github.com/sheaf-pdf/pdf-scan"
documentation = "https://docs.rs/sane-dl"
keywords = ["sane", "scanner", "scanning", "libsane", "ffi"]
categories = ["api-bindings", "external-ffi-bindings", "hardware-support", "os::unix-apis"]
# Only what users need: the sources, the README and the changelog. The
# tests stay in the repository, since they build and load a stand-in
# library from the workspace (`just sane-dl-package` checks the list).
include = ["/src", "/README.md", "/CHANGELOG.md"]

[dependencies]
libloading = "0.9"
thiserror = "2"

[dev-dependencies]
rusty-fork = { version = "0.3", default-features = false, features = ["timeout"] }
tempfile = "3"

[lints]
workspace = true
