name: CI

# Pushes to master, and pull requests: a push to a pull request's branch
# runs once, not once as a push and again as the pull request.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Each step runs a recipe from the justfile, so `just ci` locally checks the
# same things; the Ubuntu job also sets the two SANE_DL_REQUIRE_* variables
# (below), which a local run on Linux sets to match it.
jobs:
  check:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
      # On Ubuntu, SANE itself: libsane1 holds libsane and its backends,
      # `test` and `pnm` among them, which the tests drive; libsane-dev holds
      # sane.h, which the bindings are checked against. Then a test that
      # would skip for want of either fails instead. Windows and macOS have
      # no SANE here, and those tests say they skipped.
      - name: Install SANE (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsane1 libsane-dev
          dpkg-query --show libsane1 libsane-dev
          files=$(dpkg --listfiles libsane1)
          for backend in test pnm; do
            grep "/sane/libsane-$backend\.so" <<< "$files" || { echo "libsane1 lacks the $backend backend" >&2; exit 1; }
          done
          echo "SANE_DL_REQUIRE_LIBSANE=1" >> "$GITHUB_ENV"
          echo "SANE_DL_REQUIRE_HEADER=1" >> "$GITHUB_ENV"
      - name: Check formatting
        run: just fmt
      - name: Clippy
        run: just clippy
      - name: Test (including doctests)
        run: just test
      - name: Build documentation
        run: just doc

  # The layers' boundaries over every target's dependency graph, so one
  # runner checks them all; and that nothing links libsane, with libsane and
  # its header installed, so a stray link would build and the gate, not the
  # linker, says what's wrong.
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: Install SANE
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsane1 libsane-dev
          dpkg-query --show libsane1 libsane-dev
      - name: Gates
        run: just gates

  # TWAIN through the TWAIN Working Group's sample data source, a virtual
  # scanner that reads its pages from a file: the DSM and the source installed
  # by the script (the runner is elevated, so msiexec asks nothing), then
  # twain-dsm's, scan-device's and scan-worker's tests and lints in both
  # bitnesses (including scan-device's 32-bit RawImage layout unit tests,
  # TEST-12, and a 64-bit client driving both 64-bit and i686 workers), with
  # twain-dsm's bindings checked against twain.h. Its own timeout, since a hung
  # driver call would otherwise hold the runner for hours.
  twain-dsm:
    name: TWAIN through the sample source (64- and 32-bit)
    runs-on: windows-latest
    timeout-minutes: 20
    # The sample is installed below, so any TWAIN test that can't find it
    # fails rather than skipping.
    env:
      TWAIN_DSM_REQUIRE_SAMPLE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
          components: clippy
      - uses: extractions/setup-just@v4
      # Windows PowerShell 5.1, where the script was tested.
      - name: Install the sample source and the DSM
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\twain-sample.ps1 Install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: What's installed
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\twain-sample.ps1 Status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # twain.h for twain-dsm's header contract: fetched at its pinned commit
      # into the runner's temp, its hash checked, never committed (it grants
      # no licence). Then a contract that can't run fails.
      - name: Fetch twain.h
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'twain-h'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $h = Join-Path $dir 'twain.h'
          Invoke-WebRequest -UseBasicParsing -OutFile $h -Uri 'https://raw.githubusercontent.com/twain/twain-dsm/a50f7326a191c786ee2d8cb8086aea24309c071f/TWAIN_DSM/src/twain.h'
          $hash = (Get-FileHash -Algorithm SHA256 $h).Hash.ToLowerInvariant()
          if ($hash -ne 'dcae88f5212b8e625724f84dbc738386043dfeb4275db13edf659cd94704db6b') { throw "twain.h has SHA-256 $hash, not the pinned one" }
          "TWAIN_DSM_TWAIN_H=$h" >> $env:GITHUB_ENV
          'TWAIN_DSM_REQUIRE_HEADER=1' >> $env:GITHUB_ENV
      - name: twain-dsm's constants are what the script generates
        run: just twain-bindings --check
      - name: twain-dsm, 64-bit
        run: just twain-dsm-test x86_64-pc-windows-msvc
      - name: twain-dsm, 32-bit
        run: just twain-dsm-test i686-pc-windows-msvc
      - name: twain-dsm's lints, 32-bit
        run: just twain-dsm-clippy i686-pc-windows-msvc
      - name: scan-device TWAIN and unit tests, 64-bit
        run: just scan-device-twain-test x86_64-pc-windows-msvc
      - name: scan-device TWAIN and 32-bit RawImage unit tests, 32-bit
        run: just scan-device-twain-test i686-pc-windows-msvc
      - name: scan-device's lints, 32-bit
        run: just scan-device-clippy i686-pc-windows-msvc
      - name: scan-worker's lints, 32-bit
        run: just scan-worker-clippy i686-pc-windows-msvc
      - name: scan-worker 32-bit unit tests, StopHandle, Job Object, and dual-bitness TWAIN
        run: just scan-worker-twain-test

  # Without SANE installed: what the oldest Rust can break is compiling, and
  # the tests that need libsane say they skipped.
  sane-dl-msrv:
    name: sane-dl on its minimum Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keep in step with rust-version in crates/sane-dl/Cargo.toml, which
      # `just sane-dl-msrv` reads.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: extractions/setup-just@v4
      - name: Test
        run: just sane-dl-msrv

  # twain-dsm's compile_fail doctests, which show what the compiler refuses
  # (a TWAIN state kept past its run, or sent to another thread), with their
  # error codes checked: nightly's rustdoc checks them, stable's doesn't.
  twain-dsm-doc-codes:
    name: twain-dsm's compile-fail examples, their error codes checked
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: extractions/setup-just@v4
      - name: Doctests on nightly
        run: just twain-dsm-doc-codes

  # On Windows, where all of it builds; its tests that need the DSM or
  # twain.h say they skipped.
  twain-dsm-msrv:
    name: twain-dsm on its minimum Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keep in step with rust-version in crates/twain-dsm/Cargo.toml, which
      # `just twain-dsm-msrv` reads.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: extractions/setup-just@v4
      - name: Test
        run: just twain-dsm-msrv

  # Both Unix (the SANE backend) and Windows (the TWAIN backend) branches of
  # scan-device build and run their pure and fake tests on its minimum Rust;
  # tests that need libsane or TWAIN's sample source say they skipped.
  scan-device-msrv:
    name: scan-device on its minimum Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keep in step with rust-version in crates/scan-device/Cargo.toml,
      # which `just scan-device-msrv` reads.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: extractions/setup-just@v4
      - name: Test
        run: just scan-device-msrv

  # Both Unix (fd stdout isolation, process groups, fake libsane) and Windows
  # (handle/CRT stdout isolation, Job Objects, WindowGuard) branches of
  # scan-worker build and run on its minimum Rust, for the crate alone (-p),
  # beside the check job's workspace run.
  scan-worker-msrv:
    name: scan-worker on its minimum Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keep in step with rust-version in crates/scan-worker/Cargo.toml,
      # which `just scan-worker-msrv` reads.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: extractions/setup-just@v4
      - name: Test
        run: just scan-worker-msrv

  # sane-dl packaged as a publish would, in a fresh target directory, and
  # what the package holds checked: its sources, build script, README,
  # CHANGELOG, manifest and lock, nothing else. A dry run: nothing is
  # published.
  sane-dl-package:
    name: sane-dl packaged as a publish would
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: Package, and check what the package holds
        run: just sane-dl-package

  # twain-dsm packaged as a publish would on Windows (so its full cfg(windows)
  # implementation compiles during verification), and what the package holds
  # checked: its sources, README, CHANGELOG, manifest and lock, nothing else.
  twain-dsm-package:
    name: twain-dsm packaged as a publish would
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: Package, and check what the package holds
        run: just twain-dsm-package

  # Each publish-ready crate's public API read from rustdoc's JSON, hidden
  # items included (sane-dl on Ubuntu and Windows; twain-dsm on Windows, where
  # its cfg(windows) API is built, TEST-14): no unsafe function, method or
  # trait, no unsafe function pointer, no raw pointer in a public signature,
  # no static mut or target_feature function, no re-export of another crate's
  # item (scripts/public-api.jq says it all); each unsafe impl and union
  # listed. On a pinned nightly, so the JSON's format moves only when the pin
  # does, never under an unrelated pull request.
  public-api:
    name: Public API holds no unsafe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keep in step with public_api_nightly in the justfile, which `just
      # public-api` runs.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
      - uses: extractions/setup-just@v4
      - name: The public API
        run: just public-api
