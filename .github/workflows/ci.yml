name: CI

# Pushes to master, and pull requests: a push to a pull request's branch
# runs once, not once as a push and again as the pull request.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Each step runs a recipe from the justfile, so `just ci` locally checks the
# same things; the Ubuntu job also sets the two SANE_DL_REQUIRE_* variables
# (below), which a local run on Linux sets to match it.
jobs:
  check:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
      # On Ubuntu, SANE itself: libsane1 holds libsane and its backends,
      # `test` and `pnm` among them, which the tests drive; libsane-dev holds
      # sane.h, which the bindings are checked against. Then a test that
      # would skip for want of either fails instead. Windows and macOS have
      # no SANE here, and those tests say they skipped.
      - name: Install SANE (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsane1 libsane-dev
          dpkg-query --show libsane1 libsane-dev
          files=$(dpkg --listfiles libsane1)
          for backend in test pnm; do
            grep "/sane/libsane-$backend\.so" <<< "$files" || { echo "libsane1 lacks the $backend backend" >&2; exit 1; }
          done
          echo "SANE_DL_REQUIRE_LIBSANE=1" >> "$GITHUB_ENV"
          echo "SANE_DL_REQUIRE_HEADER=1" >> "$GITHUB_ENV"
      - name: Check formatting
        run: just fmt
      - name: Clippy
        run: just clippy
      - name: Test (including doctests)
        run: just test
      - name: Build documentation
        run: just doc

  # The layers' boundaries over every target's dependency graph, so one
  # runner checks them all; and that nothing links libsane, with libsane and
  # its header installed, so a stray link would build and the gate, not the
  # linker, says what's wrong.
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: Install SANE
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsane1 libsane-dev
          dpkg-query --show libsane1 libsane-dev
      - name: Gates
        run: just gates

  # TWAIN through the TWAIN Working Group's sample data source, a virtual
  # scanner that reads its pages from a file: the DSM and the source installed
  # by the script (the runner is elevated, so msiexec asks nothing), then the
  # spike in both bitnesses. Its own timeout, since a hung driver call would
  # otherwise hold the runner for hours.
  twain-spike:
    name: TWAIN through the sample source
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: extractions/setup-just@v4
      # Windows PowerShell 5.1, where the script was tested.
      - name: Install the sample source and the DSM
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\twain-sample.ps1 Install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: What's installed
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\twain-sample.ps1 Status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unit tests, 32-bit
        run: just twain-spike-test i686-pc-windows-msvc
      - name: TWAIN, 64-bit
        run: just twain-spike x86_64-pc-windows-msvc
      - name: TWAIN, 32-bit
        run: just twain-spike i686-pc-windows-msvc

  # Without SANE installed: what the oldest Rust can break is compiling, and
  # the tests that need libsane say they skipped.
  sane-dl-msrv:
    name: sane-dl on its minimum Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keep in step with rust-version in crates/sane-dl/Cargo.toml, which
      # `just sane-dl-msrv` reads.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: extractions/setup-just@v4
      - name: Test
        run: just sane-dl-msrv

  # sane-dl packaged as a publish would, in a fresh target directory, and
  # what the package holds checked: its sources, README, CHANGELOG, manifest
  # and lock, nothing else. A dry run: nothing is published.
  sane-dl-package:
    name: sane-dl packaged as a publish would
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: Package, and check what the package holds
        run: just sane-dl-package
