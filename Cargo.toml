[workspace]
resolver = "3"
# Each crate says its own edition, license and rust-version in its manifest:
# their oldest supported Rust may differ, as their dependencies do.
members = [
    "crates/sane-dl",
    "crates/scan-device",
    "crates/scan-worker",
    "crates/fake-libsane",
    "crates/twain-dsm",
]

# What more than one member takes, each taking it with `workspace = true`:
# one version for the workspace. A dependency joins once a second member
# takes it.
[workspace.dependencies]
rusty-fork = { version = "0.3", default-features = false, features = ["timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

# The rules for unsafe code, which the members that call or export a C API
# need. Each member takes them with `lints.workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
